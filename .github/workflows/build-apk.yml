
name: Gerar APK

on:
  push:
    branches: [main, principal]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses || true

      - name: Extrair projeto
        run: |
          unzip -o TojiSettings_Projeto_Android_v1.zip -d projeto

      - name: Compilar APK
        working-directory: projeto
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TojiSettings-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          
