
name: Gerar APK

on:
  push:
    branches: [main, principal]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          unzip -o TojiSettings_Projeto_Android_v1.zip -d extraido
          echo "Estrutura extraida:"
          find extraido -maxdepth 4 -type f

      - name: Localizar projeto Android
        run: |
          SETTINGS=$(find extraido -name settings.gradle -type f | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle nao encontrado"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          cp -a "$DIR"/. .
          test -d app || exit 1
          echo "Projeto localizado"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TojiSettings-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
